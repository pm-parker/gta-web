<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>罪恶湾 VICE BAY</title>
<style>
  :root { --neon: #ff2d95; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff; }
  #minimap { position: absolute; left: 18px; bottom: 18px; width: 170px; height: 170px; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,.22), 0 4px 24px rgba(0,0,0,.6); }
  #mm-nose { position: absolute; left: 96px; bottom: 176px; font-size: 11px; color: #9fd0ff; letter-spacing: 1px; opacity: .8; }
  #topright { position: absolute; top: 14px; right: 18px; text-align: right; }
  #money { font-size: 26px; font-weight: 700; color: #7cff9a; text-shadow: 0 2px 6px rgba(0,0,0,.8); font-family: "SF Mono", Menlo, monospace; }
  #stars { font-size: 22px; letter-spacing: 3px; min-height: 28px; }
  #missiontxt { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 15px; color: #ffd83d; text-shadow: 0 2px 6px rgba(0,0,0,.9); letter-spacing: 1px; }
  #speed { position: absolute; right: 18px; bottom: 26px; font-size: 15px; color: #cfe3ff; text-shadow: 0 2px 6px #000; font-family: Menlo, monospace; }
  #speed span { font-size: 30px; font-weight: 700; color: #fff; }
  #subtitle { position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%); font-size: 17px; text-shadow: 0 2px 8px #000; white-space: nowrap; }
  #ver-tag { position: absolute; top: 6px; right: 10px; font: 11px Menlo, monospace; color: rgba(255,255,255,.35); text-shadow: 0 1px 3px #000; pointer-events: none; z-index: 5; }
  #ecar-hint { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; color: #ffd83d;
    background: rgba(10,14,22,.72); border: 1px solid rgba(255,216,61,.4); padding: 5px 14px; border-radius: 20px; letter-spacing: 2px; }
  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,.55); text-shadow: 0 1px 4px #000; }
  #bench { display: none; position: absolute; top: 46px; left: 12px; font: 12px Menlo, monospace; color: #7cff9a; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; }

  /* 世界标记（3D→2D 投影） */
  #worldmarks { position: absolute; inset: 0; }
  .wmark { position: absolute; left: 0; top: 0; will-change: transform; display: none;
    font: 700 22px/1 Menlo, monospace; text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 12px currentColor;
    transform-origin: 0 0; }
  .wmark .wd { display: block; margin-left: -11px; }
  .wmark .wl { display: block; font-size: 11px; font-weight: 500; opacity: .85; margin-left: -10px; margin-top: 2px; color: #fff; }
  #dmg { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(255,0,0,0); transition: box-shadow .3s; z-index: 9; }

  /* 触屏 */
  .tbtn { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; font-size: 18px; pointer-events: auto; }
  #btn-e { right: 26px; bottom: 130px; } #btn-hb { right: 26px; bottom: 56px; } #btn-run { right: 108px; bottom: 56px; }
  #joy { position: absolute; left: 30px; bottom: 210px; width: 90px; height: 90px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); }

  /* ---------- boot / title / card ---------- */
  .screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, #101a38 0%, #05070d 70%); }
  #boot-label { color: #9fb4d8; font-size: 15px; letter-spacing: 2px; margin-bottom: 18px; }
  #boot-wrap { width: 300px; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #boot-bar { width: 0; height: 100%; background: linear-gradient(90deg, #ff2d95, #00e5ff); transition: width .25s; }
  #boot-pct { margin-top: 10px; color: #5a6f96; font-size: 11px; font-family: Menlo, monospace; }

  #title { display: none; }
  #title-logo { font-size: clamp(44px, 9vw, 92px); font-weight: 900; font-style: italic; letter-spacing: 2px;
    background: linear-gradient(180deg, #ffd83d 30%, #ff2d95 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255,45,149,.35); }
  #title-sub { color: #00e5ff; font-size: clamp(13px, 2vw, 18px); letter-spacing: 12px; margin: 4px 0 40px; font-weight: 300; }
  #startbtn { pointer-events: auto; cursor: pointer; padding: 14px 58px; font-size: 19px; letter-spacing: 6px; color: #fff;
    background: linear-gradient(135deg, rgba(255,45,149,.85), rgba(0,229,255,.75)); border: none; border-radius: 40px;
    box-shadow: 0 0 30px rgba(255,45,149,.4); transition: transform .15s; }
  #startbtn:hover { transform: scale(1.06); }
  #title-hint { color: #5a6f96; font-size: 12px; margin-top: 26px; letter-spacing: 2px; }
  #title-cred { position: absolute; bottom: 20px; color: #38455f; font-size: 11px; letter-spacing: 1px; }

  #card { display: none; background: rgba(3,5,10,.82); backdrop-filter: blur(3px); }
  #card-title { font-size: clamp(40px, 8vw, 80px); font-weight: 900; font-style: italic; letter-spacing: 4px; text-shadow: 0 0 30px currentColor; }
  #card-sub { color: #9fb4d8; margin-top: 14px; font-size: 15px; letter-spacing: 1px; }
</style>
</head>

<canvas id="view"></canvas>
<div id="dmg"></div>
<div id="hud"></div>
<div id="bench"></div>

<div id="boot" class="screen">
  <div id="boot-label">正在启动罪恶湾…</div>
  <div id="boot-wrap"><div id="boot-bar"></div></div>

</div>

<div id="title" class="screen">

</div>

  <div id="card-sub"></div>
</div>
